# KildeGUI — メニューバーアプリ (DESIGN.md §9 / §10, issue #17)
#
# .xcodeproj は生成物なのでコミットしない。次で生成する:
#   cd gui && xcodegen
name: KildeGUI
options:
  bundleIdPrefix: com.takezou621
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# 分離先リポジトリ kilde-team/kilde-cli-swift (kilde#115) をリモート依存として
# 追加し、KildeCore 製品だけをリンクする。CLI 分離後、kilde リポジトリ自体は
# SPM パッケージを持たない。
# リモート参照の実証は kilde-cli-swift#8 スパイクで完了 (SPM / Xcode 両経路で
# ビルド・実行時リンクを確認)。unsafeFlags は kilde 実行ターゲットにのみ付いており、
# GUI が消費する KildeCore 製品のビルドには影響しない。
# 本リポジトリは private 依存を持つため、パッケージ解決には kilde-team の
# メンバー権限 (git 認証) が必要 — 外部のクローン・CI では解決できない
# 制約: KildeCore (の依存閉包) に unsafeFlags が入ると、バージョン指定の依存では
# ビルドできなくなる (kilde-cli-swift#8 / kilde#115)。branch 参照の間は気づけない
# ため、unsafeFlags は kilde 実行ターゲットに限定して維持すること
packages:
  kilde-cli-swift:
    url: https://github.com/kilde-team/kilde-cli-swift.git
    # 移行期は revision 固定 (cubic レビュー指摘)。branch: main の浮動参照だと
    # kilde-cli-swift 側の push が kilde リポジトリの変更なしに GUI のビルドを壊し、
    # 解決コミットも記録されない (xcodegen が .xcodeproj 再生成時に Package.resolved
    # を消すため)。エンジンの更新を取り込むときは revision を新コミットに更新する。
    # kilde-cli-swift#10 のタグ整備後は from: "0.2.0" への切替を推奨
    # (成立条件は kilde-cli-swift#8 スパイク記録を参照)
    revision: aff76ec7766f20a4b535f4222dda20d3d643d256

targets:
  KildeGUI:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takezou621.KildeGUI
        PRODUCT_NAME: KildeGUI
        INFOPLIST_FILE: Resources/Info.plist
        # 開発用の自己署名証明書で署名する (作成手順は docs/DEVELOPMENT.md)。
        # TCC 権限 (画面収録等) はコード署名でアプリを識別するため、ad-hoc 署名の
        # ままだとビルドのたびに権限の付与し直しを要求される
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: kilde-dev
        # Xcode 26 の Debug ビルドは EF debug dylib (KildeGUI.debug.dylib) に本体を
        # 分離するが、手動署名との組合せで dyld が「異なる Team ID」でロードを拒否し
        # 起動直後に落ちる。無効化してコードを本体に直接リンクする
        ENABLE_DEBUG_DYLIB: NO
        # 配布 (issue #23) での Developer ID 署名・notarization の前提。
        ENABLE_HARDENED_RUNTIME: YES
        # Hardened Runtime 下でマイク・入力デバイス (MicStream) を使うには
        # com.apple.security.device.audio-input が必須 (issue #18)。欠けると
        # クラッシュもエラーもなく無音のトラックになる
        CODE_SIGN_ENTITLEMENTS: Resources/KildeGUI.entitlements
        # SWIFT_VERSION は swift-tools-version とは別物の「言語モード」指定で、
        # 有効値は 4 / 4.2 / 5 / 6 のみ (5.10 は invalid とされる)。
        # ルートパッケージ (swift-tools-version:5.10) が使う言語モード 5 に揃える
        SWIFT_VERSION: "5"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - package: kilde-cli-swift
        product: KildeCore
