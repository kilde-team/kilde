# KildeGUI — メニューバーアプリ (DESIGN.md §9 / §10, issue #17)
#
# .xcodeproj は生成物なのでコミットしない。次で生成する:
#   cd gui && xcodegen
name: KildeGUI
options:
  bundleIdPrefix: com.takezou621
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # ソースの文字列リテラルが日本語 (翻訳の source language) であることを
  # Xcode に伝える。無いと既定値 en 扱いになり、Localizable.xcstrings の
  # ja エントリが «翻訳先» として扱われる
  developmentLanguage: ja

# 分離先リポジトリ kilde-team/kilde-cli-swift (kilde#115) をリモート依存として
# 追加し、KildeCore 製品だけをリンクする。CLI 分離後、kilde リポジトリ自体は
# SPM パッケージを持たない。
# リモート参照の実証は kilde-cli-swift#8 スパイクで完了 (SPM / Xcode 両経路で
# ビルド・実行時リンクを確認)。unsafeFlags は kilde 実行ターゲットにのみ付いており、
# GUI が消費する KildeCore 製品のビルドには影響しない。
# 本リポジトリは private 依存を持つため、パッケージ解決には kilde-team の
# メンバー権限 (git 認証) が必要 — 外部のクローン・CI では解決できない
# 制約: KildeCore (の依存閉包) に unsafeFlags が入ると、バージョン指定の依存では
# ビルドできなくなる (kilde-cli-swift#8 / kilde#115)。branch 参照の間は気づけない
# ため、unsafeFlags は kilde 実行ターゲットに限定して維持すること
packages:
  kilde-cli-swift:
    url: https://github.com/kilde-team/kilde-cli-swift.git
    # 移行期は revision 固定 (cubic レビュー指摘)。branch: main の浮動参照だと
    # kilde-cli-swift 側の push が kilde リポジトリの変更なしに GUI のビルドを壊し、
    # 解決コミットも記録されない (xcodegen が .xcodeproj 再生成時に Package.resolved
    # を消すため)。エンジンの更新を取り込むときは revision を新コミットに更新する。
    # kilde-cli-swift#10 のタグ整備後は from: "0.2.0" への切替を推奨
    # (成立条件は kilde-cli-swift#8 スパイク記録を参照)
    # v0.8.0: 要約のテンプレート API (kilde-cli-swift#67 — issue #163 が使用) と
    # オンデバイス要約 (kilde-cli-swift#40)、エラーコード層 (kilde-cli-swift#32)、
    # 文字起こし開始前キャンセルでのハング修正 (kilde-cli-swift#54)、
    # 単一ウィンドウ収録の子ウィンドウ除外 (kilde-cli-swift#51)、
    # 文字起こし PCM の little endian 固定 (kilde-cli-swift#39) を含む (kilde#163)。
    # kilde-cli-swift 側でタグ運用が始まった (#67 マージ時に v0.8.0 を打設、
    # remote exact: 消費を検証済み) ので、revision 固定から exactVersion へ切替。
    # 消費側の注意: exact には **v 接頭辞なし**の "0.8.0" を指定する
    # (SwiftPM のセマンバージョン解釈。接頭辞付きタグは自動で解決される)。
    # エンジンの更新手順: kilde-cli-swift でタグを打設 → この exactVersion を上げる
    exactVersion: 0.8.0
  # GUI の自動更新 (issue #122)。Sparkle 2 のバイナリターゲット (macOS 12+) で、
  # リンクすると Sparkle.framework が Contents/Frameworks に埋め込まれる。
  # バージョンを固定する理由は kilde-cli-swift と同じ: 浮動参照だと上流の push が
  # このリポジトリの変更なしに GUI ビルドを壊しうるため
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.10.0
  # 利用状況の計測 (issue #135)。IDFA を収集しないためリンクするのは
  # FirebaseAnalyticsCore (GoogleAppMeasurementCore = Ad ID サポート無し)。
  # Firebase 11 までの FirebaseAnalyticsWithoutAdId は 12 でこの名前に統合された —
  # 名前が存在しないため xcodegen 生成後のビルドが「Missing package product」で落ちる
  # バージョンを固定する理由は上の 2 パッケージと同じ: 浮動参照だと上流の push が
  # このリポジトリの変更なしに GUI ビルドを壊しうるため
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.19.2

targets:
  KildeGUI:
    type: application
    platform: macOS
    sources:
      - Sources
      # アセットカタログ «だけ» を明示して足す。Resources ディレクトリごと入れると
      # Info.plist と entitlements までリソースとしてバンドルにコピーされてしまう
      # (両者は INFOPLIST_FILE / CODE_SIGN_ENTITLEMENTS から参照される設定ファイルで、
      # バンドル直下に置かれるものではない)
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # 文字列カタログ (issue #137)。ja がキー兼既定値、en / zh-Hans / ko / es を収録。
      # SwiftUI のリテラルは LocalizedStringKey としてこのカタログを引く
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      # AppShortcuts フレーズのローカライズ (issue #237)。キーは KildeIntents.swift の
      # 既定フレーズ (ja) の ${applicationName} 記法。このカタログが無いと英語環境で
      # Siri フレーズが日本語のままになる
      - path: Resources/AppShortcuts.xcstrings
        buildPhase: resources
      # Firebase の設定ファイル (issue #135)。バンドル直下に置くべきファイルなので
      # リソースとして«個別指定»する — Resources ディレクトリごと入れると Info.plist と
      # entitlements までコピーされる既存の罠 (上記コメント) を踏まないため
      - path: Resources/GoogleService-Info.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takezou621.KildeGUI
        # アプリアイコン。Assets.xcassets の AppIcon を使う。Info.plist 側の
        # CFBundleIconName と対で必要 — 片方だけだとアイコンが付かないまま通る
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: KildeGUI
        INFOPLIST_FILE: Resources/Info.plist
        # 開発用の自己署名証明書で署名する (作成手順は docs/DEVELOPMENT.md)。
        # TCC 権限 (画面収録等) はコード署名でアプリを識別するため、ad-hoc 署名の
        # ままだとビルドのたびに権限の付与し直しを要求される
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: kilde-dev
        # Xcode 26 の Debug ビルドは EF debug dylib (KildeGUI.debug.dylib) に本体を
        # 分離するが、手動署名との組合せで dyld が「異なる Team ID」でロードを拒否し
        # 起動直後に落ちる。無効化してコードを本体に直接リンクする
        ENABLE_DEBUG_DYLIB: NO
        # 配布 (issue #23) での Developer ID 署名・notarization の前提。
        ENABLE_HARDENED_RUNTIME: YES
        # Hardened Runtime 下でマイク・入力デバイス (MicStream) を使うには
        # com.apple.security.device.audio-input が必須 (issue #18)。欠けると
        # クラッシュもエラーもなく無音のトラックになる
        CODE_SIGN_ENTITLEMENTS: Resources/KildeGUI.entitlements
        # SWIFT_VERSION は swift-tools-version とは別物の「言語モード」指定で、
        # 有効値は 4 / 4.2 / 5 / 6 のみ (5.10 は invalid とされる)。
        # ルートパッケージ (swift-tools-version:5.10) が使う言語モード 5 に揃える
        SWIFT_VERSION: "5"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Firebase 公式の手順どおり -ObjC を付ける。無いと Analytics の ObjC クラス
        # が「参照されない」扱いで dead-strip され、configure() しても Analytics が
        # 初期化されない (issue #135)。CocoaPods は自動で付けるが XcodeGen は付かない
        OTHER_LDFLAGS: -ObjC
        # Crashlytics の dSYM アップロード (postBuildScripts) は SourcePackages 内の
        # スクリプトを実行しネットワークに出る。ユーザースクリプトのサンドボックスが有効
        # だとどちらも拒否される (issue #210)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      # Debug だけバンドル ID を分離する (issue #217)。TCC は (service, bundle id)
      # につき 1 レコードしか持たず、そのレコードに記録した designated requirement
      # (DR) で起動アプリの署名を検証する。Release (Developer ID) と Debug
      # (kilde-dev 証明書) は DR が互換でないため、同一バンドル ID を共用すると
      # 片方を許可するたびにもう片方が「未許可」に戻り、許可済みでも許可ダイアログが
      # 出続ける。Debug を .dev に分離して TCC のレコード自体を分ける。
      # 通知・ログイン項目・UserDefaults (Sparkle の SU* キー含む) も .dev ドメインに
      # 分かれる点は docs/DEVELOPMENT.md §2〜§3 参照。**Release は変更しない** —
      # Sparkle 更新判定・Homebrew formula・App Store がこの値に結合している
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.takezou621.KildeGUI.dev
    dependencies:
      - package: kilde-cli-swift
        product: KildeCore
      - package: Sparkle
        product: Sparkle
      - package: firebase-ios-sdk
        product: FirebaseAnalyticsCore
      # クラッシュ解析 (issue #210)。同じ firebase-ios-sdk の製品で、FirebaseApp.configure()
      # で自動的に有効になる (AppDelegate 参照)。-ObjC (上) がリンクの前提なのは Analytics と同じ
      - package: firebase-ios-sdk
        product: FirebaseCrashlytics
    # Crashlytics の dSYM アップロード (issue #210)。スタックトレースを関数名・行番号に
    # 戻すには、配布したバイナリと同じビルドの dSYM が Firebase 側に要る。
    # - Release のときだけ送る: Debug は配布されず、毎ビルドの送信は開発を遅くするだけ
    # - スクリプトの場所は SPM のチェックアウト先。${BUILD_DIR%/Build/*} は -derivedDataPath
    #   を指定した sign.sh / appstore-archive.sh (アーカイブ中は BUILD_DIR が
    #   …/Build/Intermediates.noindex/ArchiveIntermediates/… になる) でも DerivedData 直下を指す
    # - **失敗してもビルドは止めない**: 送信はネットワーク次第で、落とすとリリース
    #   (署名・notarization の前段) ごと止まる。warning を出し、送れなかった dSYM は
    #   DerivedData / .xcarchive から後で upload-symbols で送れる (docs/RELEASE.md)
    # - ENABLE_USER_SCRIPT_SANDBOXING は NO が前提 (settings 参照)。サンドボックス下では
    #   宣言外の SourcePackages 内のスクリプトを実行できず、ネットワークにも出られない
    postBuildScripts:
      - &crashlyticsUploadSymbols
        name: Upload dSYMs to Crashlytics
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then
            echo "Crashlytics: ${CONFIGURATION} ビルドのため dSYM は送らない"
            exit 0
          fi
          # SDK 同梱の Crashlytics/run は検証だけ同期で行い、送信はバックグラウンドへ回す —
          # 送信の失敗が見えず、CI ではジョブ終了で送信ごと打ち切られうる。upload-symbols を
          # 直接・同期で呼び、終了コードで成否を判定する (CodeRabbit レビュー指摘、PR #211)
          UPLOAD="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols"
          GSP="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          DSYM="${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}"
          if [ ! -x "$UPLOAD" ]; then
            echo "warning: Crashlytics の upload-symbols が見つからない ($UPLOAD)。dSYM は未送信"
            exit 0
          fi
          if [ ! -d "$DSYM" ]; then
            echo "warning: dSYM が見つからない ($DSYM)。DEBUG_INFORMATION_FORMAT を確認すること"
            exit 0
          fi
          if "$UPLOAD" -gsp "$GSP" -p mac "$DSYM"; then
            echo "Crashlytics: dSYM を送信した ($DSYM)"
          else
            echo "warning: Crashlytics への dSYM 送信に失敗 (ビルドは続行)。docs/RELEASE.md §8 の手順で後から送ること"
          fi

  # App Store 配布用ターゲット (issue #126)。直接配布の KildeGUI と**同じ Sources を
  # 条件コンパイルで共有**し、ガイドライン上の必須差分だけを持つ:
  # - App Sandbox 必須 → Resources/KildeGUI-AppStore.entitlements
  # - Sparkle (ストア外自己更新) は MAS で禁止 → パッケージ依存に入れず、
  #   APPSTORE コンパイル条件で UpdaterCoordinator 等の Sparkle 経路を除外する
  # バンドル ID は直接配布版と同じ (デュアルチャネルの標準構成)。Debug 構成だけ
  # .dev に分離する (issue #217 — TCC は署名チーム単位ではなく**バンドル ID ごとの
  # 1 レコード**に designated requirement を記録する。Developer ID DR と Apple
  # Distribution DR は Developer ID マーカ OID の有無で互換が無いため、Release 同士
  # でも同一バンドル ID の共用は権限の取り合いになる。Debug のみ分離し、配布ビルド
  # 2 種 (Developer ID / MAS) は同じ本番バンドル ID を保つ)
  # 注意: PRODUCT_NAME は KildeGUI と同じため、**ビルド成果物は -derivedDataPath で
  # 分離すること**。同じ DerivedData を使い回すと、先にビルドした KildeGUI の
  # Sparkle.framework が成果物に残り、「MAS 版に Sparkle が無い」を受け入れ条件が崩れる
  KildeGUI-AppStore:
    type: application
    platform: macOS
    sources:
      - Sources
      # アイコンは KildeGUI と同じカタログを使う (App Store 審査はアイコン必須)
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # KildeGUI と同じ文字列カタログ (issue #137)。片方だけだと MAS 版だけ
      # 英語・中国語等が出ない (ja のキーがそのまま表示される)
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      # KildeGUI と同じ AppShortcuts フレーズのローカライズ (issue #237)。
      # AppIntents は MAS でも有効なので、フレーズ翻訳も両ターゲットで必要
      - path: Resources/AppShortcuts.xcstrings
        buildPhase: resources
      # Firebase の設定ファイル (issue #135)。KildeGUI と同じ理由で個別指定
      - path: Resources/GoogleService-Info.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takezou621.KildeGUI
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: KildeGUI
        INFOPLIST_FILE: Resources/Info.plist
        # ローカル開発は kilde-dev で署名する (KildeGUI と同じ)。アーカイブ時は
        # appstore-archive.sh が自動署名
        # (Apple Development) に差し替え、配布署名 (Apple Distribution) は
        # -exportArchive 時に signingStyle=automatic + -allowProvisioningUpdates が
        # 適用する。**アーカイブ段階で Apple Distribution を指定すると
        # 「automatic signing と競合する」で xcodebuild が失敗する** (Xcode 26 実測)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: kilde-dev
        # KildeGUI と同じ Xcode 26 の EF debug dylib 問題への対策 (上記参照)
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/KildeGUI-AppStore.entitlements
        SWIFT_VERSION: "5"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # KildeGUI と同じ -ObjC の理由 (issue #135)
        OTHER_LDFLAGS: -ObjC
        # Crashlytics の dSYM アップロード (postBuildScripts) は SourcePackages 内の
        # スクリプトを実行しネットワークに出る。ユーザースクリプトのサンドボックスが有効
        # だとどちらも拒否される (issue #210)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Sparkle 経路 (UpdaterCoordinator など) を除外する条件。!APPSTORE 側に
        # Sparkle 実装を置くため、ここを消すと MAS ビルドが Sparkle に依存して失敗する
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
      # Debug だけ .dev に分離する理由は KildeGUI ターゲットと同じ (issue #217)。
      # MAS 配布ビルドの署名 (Apple Development / Apple Distribution) も kilde-dev と
      # DR が互換でないため、同一バンドル ID のままだと同じ衝突が起きる
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.takezou621.KildeGUI.dev
    dependencies:
      - package: kilde-cli-swift
        product: KildeCore
      # Analytics は Sparkle と違って MAS でも許可されるため両ターゲットで共有する
      # (issue #135)。Sparkle を MAS に入れない条件 (APPSTORE) はここでは関係ない
      - package: firebase-ios-sdk
        product: FirebaseAnalyticsCore
      # クラッシュ解析 (issue #210)。MAS 版でも許可される (ストア外の自己更新ではない)。
      # 外向き接続は既存の com.apple.security.network.client で足りる
      - package: firebase-ios-sdk
        product: FirebaseCrashlytics
    # KildeGUI と同じ dSYM アップロード (上の定義を YAML のエイリアスで共有)
    postBuildScripts:
      - *crashlyticsUploadSymbols
