name: m1 codesign probe (temporary)

# issue #633 / #470 の検証用の一時 workflow — m1 ランナーで codesign preflight を
# bounded に実行し、«codesign の鍵使用時 ACL 認証待ち» 残仮説の再現を試す。
# **PR には含めない** (マージ前に削除する)。kilde-ci ランナー (m1) のみで動く

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Codesign key probe (m1)
    runs-on: [self-hosted, macOS, ARM64, kilde-ci]
    # preflight の上限: find-identity 15 秒 + 1 identity あたり 90 秒 + 診断 1 分級。
    # 沈黙しても 15 分で必ず確定する
    timeout-minutes: 15
    steps:
      - name: Checkout kilde
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Codesign key preflight (bounded)
        env:
          PREFLIGHT_PROBE_SEC: "90"
        shell: bash
        run: scripts/release/codesign-preflight.sh
