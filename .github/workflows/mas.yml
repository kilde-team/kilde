name: MAS (App Store)

# issue #160 / #154: Mac App Store 提出の m1 (self-hosted) ライン。
# kilde リポジトリに登録した 2 つ目のランナー (m1-kilde, ラベル kilde-ci) でだけ動く。
#
# モード (workflow_dispatch の mode):
#   plan   — spec を生成して干渉なく計画を表示 (API キー不要。asc-submit v0.2.0 の
#            キー無し dry-run)。設定検証・レビュー用
#   status — バージョンの状態・ビルド・提出の有無を表示 (読み取りのみ。反映結果の裏取り)
#   apply  — バージョン作成 (無ければ) + メタデータ (説明 / What's New / キーワード /
#            サブタイトル) + スクリーンショットを反映。build を指定すれば割当ても。
#            **審査への提出はしない**
#   submit — apply の内容に加えて審査へ提出する。提出判断 (前バージョンの審査結果待ち等)
#            は人間が行う前提なので、このモードの実行自体がゲート
#   submit-only — **スクリーンショットを触らずに** 審査へ提出する。前提: 先に mode=apply
#            を実行して asset が処理済みになっていること。ASC はアップロード直後の
#            スクリーンショットを «処理中» にするため、submit モードの
#            «再アップロード → その場で提出» は «Asset is being processed» で
#            拒否され続ける (0.36.0 実測 — 4 連敗、issue #529)。apply → 数分待つ →
#            submit-only の 2 段階で提出する
#   upload — KildeGUI-AppStore をアーカイブして ASC へアップロード (appstore-archive.sh)。
#            **提出は始まらない**。クラウド署名は ASC API キー (Admin ロール) で行う
#
# 必要な secrets (status / apply / submit / submit-only / upload):
#   ASC_CI_KEY_B64   CI 専用 **Admin** ロール鍵の .p8 を base64 したもの
#                    (クラウド署名は Admin 限定。メタデータ書き込みは App Manager でも可 —
#                    鍵は 1 本にまとめる。開発用の鍵を使い回さない)
#   ASC_CI_KEY_ID    キー ID
#   ASC_CI_ISSUER    issuer ID
#   (upload のみ) KILDE_CLI_SWIFT_TOKEN — 既存の fine-grained PAT (cli-swift 読み取り)
#
# トリガは workflow_dispatch のみ。kilde は public リポジトリのため、fork PR から
# self-hosted runner や secrets に触れる経路を持ち得ない — この構成を変えるときは
# その点を再確認すること。
#
# 冪等化 (issue #615): 各段階の実行前に «preflight» step が ASC の実状態を
# 読み取りのみで照会し (scripts/release/mas-state.py)、既に到達済みの段階を
# スキップして success で終わる。0.45.0 で «提出済みの版への apply 再実行が
# HTTP 409 で failure» (run 44795636897) «upload の 2 時間タイムアウト後に
# 再 dispatch しても状態が分からない» という誤認が起きたため:
#   - apply / submit: 版が提出済み以降の状態 (WAITING_FOR_REVIEW など編集不可) なら
#     何もせず success — 再 dispatch・途中再開で二重提出や 409 の failure を作らない
#   - upload: 指定 build が ASC に既に存在すればアーカイブをやり直さず再利用する
#     (ただし FAILED / INVALID の build は同じ番号で再アップロードできないため失敗させる)
#   - upload 後は ASC 上で build が VALID になったことを poll で確認する
#     («アップロードできたか» の判定を ASC 実状態で行う)
#   - upload step には停滞検知の watchdog がある (無出力 12 分 / 上限 70 分で打ち切り)。
#     0.42.0 以降 «Archive and upload» が CodeSign あたりで沈黙し job 上限まで
#     費やす事故 (#470 関連) が続いたため、timeout-minutes の延長 (#589) の次の一手

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        options: [plan, status, apply, submit, submit-only, upload]
        default: plan
      version:
        description: "MAS version (e.g. 0.8.1)"
        type: string
        required: true
      build:
        description: "Build number (attach in apply/upload; e.g. 8)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: mas-${{ inputs.version }}
  cancel-in-progress: false

env:
  APP_ID: "6812783176" # com.takezou621.KildeGUI
  # asc-submit v0.3.0 の run 実行ジャーナル (ステップ状況・ログ) の置き場。
  # ワークスペース内 (.asc-submit/runs) だと次ジョブの checkout クリーンで消えるため、
  # ランナーのホーム直下に永続化して失敗時の事後調査 (asc-submit logs <id>) に使う。
  # serve (読み取り専用ダッシュボード) もこのディレクトリを --runs-dir で見る。
  # ピン更新時の serve 再配置を含む運用手順は docs/appstore/asc-submit-ops.md
  ASC_SUBMIT_RUNS_DIR: /Users/kawai/asc-submit-runs

jobs:
  mas:
    name: MAS ${{ inputs.mode }} (m1)
    # kilde リポジトリスコープの self-hosted ランナー (m1-kilde) を指すラベル。
    # cli-swift の CI と同じ kilde-ci ラベルだが、あちらのランナーは別リポジトリ
    # スコープのためここには来ない
    runs-on: [self-hosted, macOS, ARM64, kilde-ci]
    # issue #589: 0.42.0 の upload (run 43987897190) が «アーカイブ → エクスポート →
    # ASC アップロード» で 60 分を超え、ジョブ上限の 60 分で打ち切られた。所要は機体
    # 負荷で変わる (0.39.0〜0.41.0 は m1 オフラインのためローカル経路で実施しており、
    # m1 経路の所要実績が無かった) ので余裕を持って 120 に引き上げる。
    # **upload モードだけ** 120 (他のモードは従来どおり 60): ジョブ上限はランナーの
    # 占有時間の上限でもあるため、数分で終わる plan / status / apply / submit /
    # submit-only を 120 分まで占有し続ける理由が無い (cubic レビュー指摘)。
    # ジョブレベルの timeout-minutes は inputs を含む式をサポートする
    # (GitHub docs «Contexts availability» の jobs.<job_id>.timeout-minutes 行)
    timeout-minutes: ${{ inputs.mode == 'upload' && 120 || 60 }}

    steps:
      - name: Checkout kilde
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 認証情報を .git/config に残さない (zizmor artipacked — kilde#201)。
          # この workflow は push も git 認証もしない
          persist-credentials: false

      - name: Checkout asc-submit (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: takezou621/asc-submit
          # v0.2.0: spec の keywords / subtitles 対応 (未満は未知のキーを黙って無視)。
          # v0.2.1: create-version の platform 列挙値修正 (OS_X → MAC_OS。v0.2.0 は
          # バージョン作成が HTTP 409 で失敗する — apply の初回実行 run 36252411489 で発見)
          # v0.3.0: ワークフローのジャーナル記録 (各ステップの状況・ログを .asc-submit/runs に
          # 記録。submit 確認の辞退はキャンセル扱い。run/serve/runs/logs の下位互換は維持)
          # v0.4.0: run が spec を lint してから実行するようになった (プレースホルダー・
          # キー打ち間違い・上限違反を API キー無しで事前検出)。生成済み spec 0.8.1 /
          # 0.8.2 で validate を通して警告のみ・エラー 0 を実証済み。審査結果監視 wait・
          # リリース制御 (phased-release / schedule-release)・メタデータ拡張も入ったが
          # この workflow の経路は変えない
          # タグではなくコミット SHA に固定する (タグ移動で異なるコードが走るのを防ぐ —
          # CodeRabbit セキュリティ指摘)。SHA は v0.4.0 を指す
          ref: e502db24a78c5b397d16909b521621c18ffcff94 # v0.4.0 ベースに asc-submit main の修正を含むコミット (PR 9〜12 + 終端 state の提出を未提出扱いにしない・余りの DELETE 403 を許容 (PR 15) + cancel を PATCH submitted:false に切替 (PR 16) + 残置下書きの掃除手順案内 (PR 17 / issue 14) + item 付き未提出 submission の保護と mix 草稿の再利用防止 (PR 18 / issue 13))
          path: asc-submit
          persist-credentials: false

      - name: Generate the spec from the metadata files
        if: inputs.mode != 'status'
        # 全モード共通 (status を除く): docs/appstore/metadata から spec.json を作る。
        # メタデータの上限 (キーワード 100 文字 / ロケール別バイト、サブタイトル 30 文字) は
        # この生成が機械検証する (appstore-spec.py)。spec に secrets は含まれないため
        # ログへ全文出して監査証跡にする
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          # 入力は env 経由 (テンプレート展開のシェルインジェクション防止 — kilde#203)
          echo "$VERSION" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._-]*$' \
            || { echo "バージョンに使えない文字が含まれます: $VERSION"; exit 1; }
          if [ "$MODE" = upload ] && [ -z "$BUILD" ]; then
            echo "upload モードには build 番号が必要です (CFBundleVersion。前回の MAS 提出より大きい値)"
            exit 1
          fi
          ARGS=(--version "$VERSION")
          [ -n "$BUILD" ] && ARGS+=(--build "$BUILD")
          SPEC_OUT="dist/appstore/release-$VERSION.json"
          python3 scripts/release/appstore-spec.py "${ARGS[@]}"
          if [ "$MODE" = submit-only ]; then
            # スクリーンショットを触らない — asc-submit の run_spec は
            # spec に screenshots が無ければ set_screenshots を呼ばない。
            # «再アップロード → 処理中 → 提出拒否» の自己打ち切りレースを
            # 断つための送り (issue #529)
            # (1 行の python3 -c に収めて step を簡潔にする)
            python3 -c 'import json,sys; p=sys.argv[1]; s=json.load(open(p)); s.pop("screenshots", None); json.dump(s, open(p, "w"), ensure_ascii=False)' "$SPEC_OUT"
          fi
          echo "spec_path=$SPEC_OUT" >> "$GITHUB_ENV"
          cat "$SPEC_OUT"

      - name: Show the plan (no API key required)
        if: inputs.mode == 'plan'
        env:
          PYTHONPATH: asc-submit
        run: |
          # asc-submit v0.2.0 の --dry-run は API キー無しで動く (計画表示のみ)。
          # secrets を設定する前にこのワークフローの経路を検証できる
          python3 -m asc_submit run "$APP_ID" --spec "$spec_path" --dry-run

      - name: Decode the App Store Connect API key
        # upload も含める: アーカイブ〜アップロードのクラウド署名を ASC API キーで
        # 行う (下の upload step 参照)。plan は書き込まないので鍵不要
        if: inputs.mode != 'plan'
        env:
          ASC_CI_KEY_B64: ${{ secrets.ASC_CI_KEY_B64 }}
          ASC_CI_KEY_ID: ${{ secrets.ASC_CI_KEY_ID }}
          ASC_CI_ISSUER: ${{ secrets.ASC_CI_ISSUER }}
        run: |
          # 部分的な設定は黙って進めない (release.yml の署名 secrets と同じ方針)。
          # セッションは self-hosted のため残したくないものは必ず後段の cleanup で消す
          SET_COUNT=0
          [ -n "$ASC_CI_KEY_B64" ] && SET_COUNT=$((SET_COUNT+1))
          [ -n "$ASC_CI_KEY_ID" ] && SET_COUNT=$((SET_COUNT+1))
          [ -n "$ASC_CI_ISSUER" ] && SET_COUNT=$((SET_COUNT+1))
          if [ "$SET_COUNT" -ne 3 ]; then
            echo "ASC_CI_KEY_B64 / ASC_CI_KEY_ID / ASC_CI_ISSUER の 3 つすべてが必要です"
            echo "(CI 専用の Admin ロールのキーを ASC の Users and Access → Integrations で発行し、"
            echo " .p8 を base64 して ASC_CI_KEY_B64 に登録してください — 開発用キーの流用はしない。"
            echo " ロールは発行後に変更できない。クラウド署名は Admin 限定の実測 — 0.8.1)"
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_CI_KEY_B64" | base64 --decode -o "$RUNNER_TEMP/asc/AuthKey.p8"
          # ASC_KEY_* は asc-submit が読む環境変数。GITHUB_ENV 経由で以降の step へ
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_CI_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER=$ASC_CI_ISSUER" >> "$GITHUB_ENV"

      - name: Show the version status (read-only)
        if: inputs.mode == 'status'
        env:
          VERSION: ${{ inputs.version }}
          PYTHONPATH: asc-submit
        run: |
          # 書き込みなしの監査用: バージョンの状態・ビルド・提出の有無を表示する。
          # apply/submit の反映結果の裏取りに使う
          python3 -m asc_submit status "$APP_ID" --version "$VERSION"

      - name: Read the ASC state (preflight, read-only)
        id: preflight
        # 書き込みを行うモード (apply / submit / submit-only / upload) の前に
        # ASC の実状態を照会する。判定の正本は ASC 実状態 — 0.45.0 のように
        # «conclusion だけ見ると失敗に見える» 誤認を防ぐ (issue #615)。
        # 読み取りのみで副作用はない。plan は書き込まないので鍵不要、status は
        # 自前の status コマンドで同じ情報が見られるためここでは走らない
        if: inputs.mode == 'apply' || inputs.mode == 'submit' || inputs.mode == 'submit-only' || inputs.mode == 'upload'
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          PYTHONPATH: asc-submit
        run: |
          ARGS=(--app "$APP_ID" --version "$VERSION")
          if [ -n "$BUILD" ]; then
            # key=value をファイルへ書いて GITHUB_OUTPUT に載せる (self-hosted の
            # RUNNER_TEMP はジョブごとに掃われるが、前ジョブの残留があっても
            # 誤らないよう毎回消す)
            rm -f "$RUNNER_TEMP/mas-state-outputs.txt"
            ARGS+=(--build "$BUILD" --output-file "$RUNNER_TEMP/mas-state-outputs.txt")
          fi
          python3 scripts/release/mas-state.py "${ARGS[@]}"
          if [ -n "$BUILD" ]; then
            cat "$RUNNER_TEMP/mas-state-outputs.txt" >> "$GITHUB_OUTPUT"
          else
            # build 未指定のモード: 欠落した出力は if 条件で空文字になるため
            # «存在しない» を明示しておく
            { echo "build_state=absent"; echo "build_present=false"; } >> "$GITHUB_OUTPUT"
          fi

      # 冪等ゲート: 提出済み以降の版 (WAITING_FOR_REVIEW など編集不可の状態) に対する
      # apply / submit は何もせず success で終わる。0.45.0 では WAITING_FOR_REVIEW の
      # 版に build 割当て PATCH を試みて HTTP 409 «The specified pre-release build
      # could not be added» で failure になった (run 44795636897) — 再 dispatch が
      # «失敗» に見える誤認をここで断つ (issue #615)
      - name: Apply metadata (skip when the version is already submitted)
        if: inputs.mode == 'apply' && steps.preflight.outputs.version_editable == 'true'
        env:
          PYTHONPATH: asc-submit
        run: |
          # 先に doctor で鍵が実際に書き込み可能か確かめる (失効・ロール不足を
          # ここで弾く。doctor はプローブのみで副作用なし)
          python3 -m asc_submit doctor "$APP_ID"
          python3 -m asc_submit run "$APP_ID" --spec "$spec_path"

      - name: Skip the apply (version already submitted)
        if: inputs.mode == 'apply' && steps.preflight.outputs.version_editable != 'true'
        env:
          VERSION: ${{ inputs.version }}
          STATE: ${{ steps.preflight.outputs.version_state }}
        run: |
          echo "version $VERSION は既に $STATE (提出済み以降で編集不可) — apply をスキップして success で終わります"
          echo "(冪等スキップ — 提出済み版への再 dispatch で 409 の failure を作らないため。issue #615)"

      - name: Apply metadata and submit for review (skip when already submitted)
        if: (inputs.mode == 'submit' || inputs.mode == 'submit-only') && steps.preflight.outputs.version_editable == 'true'
        env:
          MODE: ${{ inputs.mode }}
          PYTHONPATH: asc-submit
        run: |
          # 先に doctor で鍵が実際に書き込み・提出可能か確かめる (失効・ロール不足を
          # ここで弾く。doctor はプローブのみで副作用なし)
          python3 -m asc_submit doctor "$APP_ID"
          # CI (非 tty) では asc-submit の確認プロンプトは出ない。提出のゲートは
          # この workflow_dispatch を手で押すこと自体なので --yes で確定させる
          echo ">>> 審査へ提出します (mode=$MODE)"
          python3 -m asc_submit run "$APP_ID" --spec "$spec_path" --submit --yes

      - name: Skip the submission (version already submitted)
        if: (inputs.mode == 'submit' || inputs.mode == 'submit-only') && steps.preflight.outputs.version_editable != 'true'
        env:
          VERSION: ${{ inputs.version }}
          STATE: ${{ steps.preflight.outputs.version_state }}
        run: |
          echo "version $VERSION は既に $STATE — 審査への提出は済んでいるため何もせず success で終わります"
          echo "(冪等スキップ — 二重提出や 409 の failure を作らないため。issue #615)"

      # FAILED / INVALID の build は同じ番号では再アップロードできない (ASC の契約)。
      # «build が既に在るから再利用» の対象から外し、番号を増やすよう明示して失敗させる
      - name: Fail on a dead build number (cannot be re-uploaded)
        if: inputs.mode == 'upload' && steps.preflight.outputs.build_present == 'true' && contains(fromJSON('["FAILED", "INVALID"]'), steps.preflight.outputs.build_state)
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          STATE: ${{ steps.preflight.outputs.build_state }}
        run: |
          echo "build $BUILD は ASC に存在しますが state=$STATE — 同じ番号での再アップロードはできません"
          echo "build 番号を 1 つ増やして upload をやり直してください (mas.yml mode=upload version=$VERSION build=<N+1>)"
          exit 1

      - name: Archive and upload the MAS build (with stall watchdog)
        if: inputs.mode == 'upload' && steps.preflight.outputs.build_present != 'true'
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          KILDE_CLI_SWIFT_TOKEN: ${{ secrets.KILDE_CLI_SWIFT_TOKEN }}
          # クラウド署名は ASC API キー (**Admin ロール** — 配布証明書の作成は
          # Account Holder/Admin 限定で、App Manager のキーだと "You haven't been
          # given access to cloud-managed distribution certificates" でエクスポートが
          # 落ちた。run 36281605553 で Admin 鍵により成功を実証) で行う。m1 の Xcode
          # Apple ID セッションは xcodebuild から見えない実測 (run 36279294564:
          # "No Accounts" でアーカイブが落ちた) ので、キー経路に統一する。変数名が
          # asc-submit の ASC_KEY_* と違うのはわざと (CLAUDE.md §5-19: notarization 用の
          # AC_API_KEY* と混線しないようにスクリプト側で分けている)
          KILDE_ASC_API_KEY: ${{ env.ASC_KEY_PATH }}
          KILDE_ASC_API_KEY_ID: ${{ env.ASC_KEY_ID }}
          # KILDE_ASC_API_ISSUER — 「KEY」を挟まない (スクリプトの変数名。PR #255 で
          # KILDE_ASC_API_KEY_ISSUER と書いて issuer だけ空になり、
          # 「3 つとも指定するか全省略」のガードで止まった — run 36279930209)
          KILDE_ASC_API_ISSUER: ${{ env.ASC_ISSUER }}
          MAS_UPLOAD_IDLE_LIMIT_MIN: "12"
          MAS_UPLOAD_BUDGET_MIN: "70"
        run: |
          # appstore-archive.sh は KILDE_CLI_SWIFT_TOKEN を環境変数だけで使う
          # (git config を汚さない)
          [ -n "$KILDE_ASC_API_KEY" ] || { echo "ASC API キーが展開できていません (decode step を確認)"; exit 1; }
          export PATH="$HOME/bin:$PATH"
          command -v xcodegen >/dev/null \
            || { echo "~/bin/xcodegen が見つかりません (XcodeGen 2.46.0 を m1 の ~/bin へインストール済みのはず)"; exit 1; }
          #
          # 停滞検知の watchdog (issue #615)。0.42.0 以降、この step が CodeSign あたりで
          # 沈黙し job 上限 (60 → 120 分、#589) まで費やして cancelled になる事故が続いた
          # (0.45.0 の run 44791492122 は最後のログ出力から正味 2 時間、1 行も進まなかった)。
          # timeout-minutes の延長は «ハングを長く観察する» だけなので、次の一手として:
          #   - スクリプトの出力をログファイルへ退け、main 側で 1 分ごとに経過時間と
          #     最新行を出す (進捗の定期出力 — «動いているのか» を job ログから追える)
          #   - 無出力が MAS_UPLOAD_IDLE_LIMIT_MIN 分続いたらハングとみなして打ち切り、
          #     上限 MAS_UPLOAD_BUDGET_MIN 分でも打ち切る (打ち切りは明示的な失敗 —
          #     ジョブ上限での cancelled と違い、診断行と後続の案内がログに残る)
          # 打ち切り後の経路は 0.43.0 / 0.44.0 / 0.45.0 の前例どおりローカルの
          # appstore-archive.sh への切り替え (issue #470 のキーチェーン/証明書まわりの
          # 調査が正本。ここでは «ハングを 2 時間観察しない» ことだけを担う)
          LOG="$RUNNER_TEMP/mas-upload-$VERSION-build$BUILD.log"
          scripts/release/appstore-archive.sh --version "$VERSION" --build "$BUILD" --upload >"$LOG" 2>&1 &
          PID=$!
          START=$SECONDS
          LAST_SIZE=0
          LAST_CHANGE=$SECONDS
          KILLED=""
          while kill -0 "$PID" 2>/dev/null; do
            sleep 60
            NOW=$SECONDS
            SIZE=$(stat -f %z "$LOG" 2>/dev/null || echo 0)
            if [ "$SIZE" != "$LAST_SIZE" ]; then LAST_CHANGE=$NOW; LAST_SIZE=$SIZE; fi
            echo "[watchdog] 経過 $(( (NOW - START) / 60 )) 分 / 無出力 $(( (NOW - LAST_CHANGE) / 60 )) 分 | $(tail -n 1 "$LOG" | cut -c1-160)"
            if [ $(( (NOW - LAST_CHANGE) / 60 )) -ge "$MAS_UPLOAD_IDLE_LIMIT_MIN" ]; then
              KILLED="idle (無出力 ${MAS_UPLOAD_IDLE_LIMIT_MIN} 分)"
              break
            fi
            if [ $(( (NOW - START) / 60 )) -ge "$MAS_UPLOAD_BUDGET_MIN" ]; then
              KILLED="budget (上限 ${MAS_UPLOAD_BUDGET_MIN} 分)"
              break
            fi
          done
          RC=0
          if [ -n "$KILLED" ]; then
            # xcodebuild の残滓も含めて止める (SWBBuildService など孫プロセスは
            # DerivedData のパスで拾う。取り逃しは runner の orphan 掃除が受ける)
            kill "$PID" 2>/dev/null || true
            pkill -P "$PID" 2>/dev/null || true
            sleep 3
            kill -9 "$PID" 2>/dev/null || true
            pkill -f "dist/appstore/derived" 2>/dev/null || true
            echo ">>> watchdog が Archive and upload を打ち切りました: $KILLED"
            echo ">>> 0.42.0 以降この経路は «CodeSign あたりで沈黙 → job 上限まで停滞» を繰り返しています (issue #470 / #615)。"
            echo ">>> ローカル経路へ切り替えてください: scripts/release/appstore-archive.sh --version $VERSION --build $BUILD --upload (この Mac、Admin 鍵のクラウド署名)"
            echo ">>> --- 最後の 30 行 ---"
            tail -30 "$LOG"
            exit 1
          fi
          wait "$PID" || RC=$?
          # 失敗時は原因 (Cloud signing permission error など) をログから追えるよう
          # 全文を job ログへ出す。成功時も監査証跡として全文を残す
          cat "$LOG"
          if [ "$RC" -eq 0 ]; then
            echo "アップロード完了。次の step が ASC 上で build $BUILD が VALID になることを確認します"
          fi
          exit "$RC"

      - name: Skip the upload (build already exists — reuse it)
        if: inputs.mode == 'upload' && steps.preflight.outputs.build_present == 'true' && !contains(fromJSON('["FAILED", "INVALID"]'), steps.preflight.outputs.build_state)
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          STATE: ${{ steps.preflight.outputs.build_state }}
        run: |
          echo "build $BUILD は既に ASC に存在します (state=$STATE) — アーカイブとアップロードを再実行せず再利用します"
          echo "(冪等スキップ — 途中再開・再 dispatch で同じ番号の二重アップロードを作らないため。issue #615)"

      # upload が終わっても ASC 側の処理で build が見えるまで数十秒〜数分かかる。
      # «アップロードできたか» の判定をこの run の終了コードではなく ASC 実状態
      # (build の存在と processingState) で行う — 0.45.0 の教訓 (conclusion と
      # 実状態の食い違い) の機械化。upload をスキップした (再利用) 場合も
      # ここで現在の状態を確認して記録に残す (issue #615)
      - name: Confirm the build in ASC (read-only poll)
        if: inputs.mode == 'upload'
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          PYTHONPATH: asc-submit
        run: |
          DEADLINE=$((SECONDS + 20 * 60))
          while :; do
            OUT="$(python3 scripts/release/mas-state.py --app "$APP_ID" --version "$VERSION" --build "$BUILD")"
            echo "$OUT"
            STATE="$(sed -n 's/^build_state=//p' <<<"$OUT")"
            case "$STATE" in
              VALID)
                echo ">>> build $BUILD は ASC で VALID — apply (メタデータ + build 割当て) に進めます"
                exit 0 ;;
              FAILED|INVALID)
                echo ">>> build $BUILD は $STATE — 同じ番号では再アップロードできません。番号を増やして upload をやり直してください"
                exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo ">>> 20 分以内に build $BUILD が VALID になりませんでした (最後の状態: ${STATE:-absent})"
              echo ">>> mas.yml mode=status で実状態を再確認するか、前の step のログを調査してください"
              exit 1
            fi
            sleep 60
          done

      # この cleanup は **最後の step** でなければならない (run 36280364021 実測:
      # 前に置くと upload モードで decode → cleanup → archive の順に走り、アーカイブの
      # 時点で .p8 が消えて「API キーが見つかりません」で落ちた)
      - name: Remove the decoded key
        if: ${{ always() && (inputs.mode != 'plan') }}
        run: |
          # .p8 を RUNNER_TEMP に残さない (self-hosted はジョブ間でディレクトリが残る)
          rm -rf "$RUNNER_TEMP/asc"
