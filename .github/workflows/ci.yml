name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift build and test
    # macos-26 を使用する — kilde は macOS 26 の SCStreamConfiguration.Preset
    # (captureHDRRecordingPreservedSDRHDR10、issue #76) を参照するため、
    # ビルドに Xcode 26 SDK が必須になった。実行は macOS 14+ のまま — デプロイメント
    # ターゲットは Package.swift の .platforms 宣言で決まり、ビルド SDK に依らない。
    # macOS 14 / 15 の実機差異は手動検証 issue #4 の対象。
    # swift --version + SDK バージョンのハッシュをキャッシュキーに含めて混入を防ぐ。
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Hash toolchain version
        id: toolchain
        # swift --version だけだと SDK のマイナーアップデート (コンパイラ不変) を
        # 捕捉できないため、SDK バージョンもハッシュに含める
        run: |
          hash="$( { swift --version 2>&1; xcrun --show-sdk-version; } | shasum | cut -c1-12)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swift-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-${{ steps.toolchain.outputs.hash }}-

      - name: Build release binary
        run: swift build -c release

      - name: Verify embedded Info.plist
        run: otool -P .build/release/kilde | grep -q NSMicrophoneUsageDescription

      - name: Run unit tests
        run: swift test

      # 統合テストは画面収録・マイク権限、スピーカー音量、実録画デバイスが必要なため
      # CI では実行しない。ローカルの scripts/integration-test.sh で実行する。

  old-os-build:
    name: Swift build (macos-15, deployment check)
    # issue #4 の自動化できる側: 実行は macOS 14+ を宣言しているが、ビルド SDK を
    # Xcode 26 に上げた (#76/#81) ことで旧 SDK でのビルド可能性は見えなくなった。
    # この job は macos-15 ランナー (旧 Xcode) で swift build が通ることを保証し、
    # 「ビルドに新 SDK が要るが旧 OS での実行は 14+」の後半が壊れたら即座に分かるようにする。
    # 旧 OS での実挙動 (統合テスト) は引き続き手動検証 (issue #4) の対象。
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Swift build (debug)
        run: swift build
      - name: Swift build (release)
        run: swift build -c release
