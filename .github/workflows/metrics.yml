name: ASC metrics ledger

# ASC の計測データ (Sales Report と App Analytics API) を日次で取得して
# data/metrics/ 以下の CSV に追記する (issue #601)。
#
# - 台帳 (docs/metrics.md / docs/appstore/metadata/metrics.md) への転記は人間と
#   エージェントの月次作業だが、**一次データの取得はこの workflow が毎日行う**。
#   日次 Sales Report は取得しないと取り逃す (リトライ可能だが未取得日の機会損失は
#   戻らない) ため
# - **スクリプトはアプリ固有値をハードコードしない** (scripts/metrics/fetch_asc_metrics.py)。
#   env の APP_ID / VENDOR_NUMBER / SALES_SKUS を変えれば eyechecker など同じ
#   ASC API キーで取得できる他アプリにそのまま流用できる (2026-11-19 に eyechecker
#   側へも同様の仕組みを依頼中 — 実装時にこの workflow を雛形にすること)
# - secrets は mas.yml と同じ ASC_CI_* (CI 専用 Admin 鍵) を再利用する。新規 secrets
#   は追加しない。schedule は fork PR から触れないトリガなので secrets の扱いは安全
#   (mas.yml のコメントと同じ方針)
# - IAP の販売を検知したら IAP_SALES_DETECTED の印を出し、この workflow が issue を
#   起票する (売上の気づきは即時にしたい — docs/metrics.md の «初の有料転換» が
#   2026-11-15 に Sales Report から判明した実績がある。レビュー検知の issue 起票は
#   eyechecker の appstore-reviews.yml と同じ構成)

on:
  schedule:
    # JST 5:00。Sales Report の日次分は地域ごとに「翌日 5am PT (米州)」「翌日
    # 5am JST (日本・豪州・NZ)」までに配信されるため、日本側の配信完了後の時刻にする
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      from-date:
        description: "取得開始日 (YYYY-MM-DD。空なら前日のみ)"
        required: false
        default: ""
      to-date:
        description: "取得終了日 (YYYY-MM-DD。空なら前日のみ)"
        required: false
        default: ""
      skip-analytics:
        description: "App Analytics の取得をスキップする (デバッグ用)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: asc-metrics-ledger
  cancel-in-progress: false

env:
  # ★ アプリ固有の設定はここだけ (eyechecker への流用時に書き換える場所)
  APP_ID: "6812783176" # com.takezou621.KildeGUI (MAS)
  VENDOR_NUMBER: "85006198"
  SALES_SKUS: "kilde-mas"
  ANALYTICS_REPORTS: "App Store Discovery and Engagement Detailed,App Downloads Detailed"
  DATA_DIR: "data/metrics"

jobs:
  fetch:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the daily sales report
        id: sales
        env:
          ASC_KEY_B64: ${{ secrets.ASC_CI_KEY_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_CI_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_CI_ISSUER }}
          FROM_DATE: ${{ inputs.from-date }}
          TO_DATE: ${{ inputs.to-date }}
        run: |
          # 日付の既定は «前日» (日次レポートは翌日に配信されるため)。
          # workflow_dispatch の入力があればバックフィルとしてその範囲を使う
          FROM="${FROM_DATE:-$(date -v-1d +%F)}"
          TO="${TO_DATE:-$(date -v-1d +%F)}"
          echo "from=$FROM to=$TO"
          python3 scripts/metrics/fetch_asc_metrics.py \
            --key-id "$ASC_KEY_ID" --issuer-id "$ASC_ISSUER" \
            --key-b64 "$ASC_KEY_B64" \
            sales --vendor-number "$VENDOR_NUMBER" --skus "$SALES_SKUS" \
            --from-date "$FROM" --to-date "$TO" \
            --csv "$DATA_DIR/sales-daily.csv" | tee sales.log
          # IAP の販売検知を後段の issue 起票に渡す
          if grep -q IAP_SALES_DETECTED sales.log; then
            echo "iap_detected=true" >> "$GITHUB_OUTPUT"
            grep '^IAP_ROW' sales.log > iap-rows.txt || true
          fi

      - name: Fetch the App Analytics daily instances
        if: ${{ !inputs.skip-analytics }}
        env:
          ASC_KEY_B64: ${{ secrets.ASC_CI_KEY_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_CI_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_CI_ISSUER }}
        run: |
          # インスタンス未生成の日は 0 件で正常終了する設計 (スクリプト側で処理)。
          # レポート生成が始まれば翌日以降の実行で自動的に溜まり始める
          python3 scripts/metrics/fetch_asc_metrics.py \
            --key-id "$ASC_KEY_ID" --issuer-id "$ASC_ISSUER" \
            --key-b64 "$ASC_KEY_B64" \
            analytics --app-id "$APP_ID" --reports "$ANALYTICS_REPORTS" \
            --csv-dir "$DATA_DIR"

      - name: Commit the fetched data
        id: commit
        env:
          FROM_DATE: ${{ inputs.from-date }}
          TO_DATE: ${{ inputs.to-date }}
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain $DATA_DIR)" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "新しい行は無し — コミットしない"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DATA_DIR"
          FROM="${FROM_DATE:-$(date -v-1d +%F)}"
          TO="${TO_DATE:-$(date -v-1d +%F)}"
          git commit -m "metrics: record the ASC reports for $FROM..$TO"
          git push
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Open an issue when an IAP sale is detected
        if: steps.sales.outputs.iap_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 重複起票の防止は «タイトルに日付を含める» だけで足りる (eyechecker の
          # appstore-reviews.yml と同じく、過去 issue を状態保持の代わりに使う)。
          # IAP_ROW は sales step の tee 済みログから復元する
          ROWS=$(cat iap-rows.txt | sed 's/^IAP_ROW\t//' || true)
          DATE=$(echo "$ROWS" | head -1 | cut -d, -f1)
          TITLE="計測: IAP の販売を検知しました (${DATE})"
          if gh issue list --search "in:title \"$TITLE\"" --state all --limit 5 | grep -q .; then
            echo "既に起票済み — スキップ"
            exit 0
          fi
          {
            echo "ASC Sales Report で IAP の販売を検知しました。docs/metrics.md の"
            echo "«IAP 販売数と DL の月次台帳» への転記をお願いします。"
            echo ""
            echo '```'
            echo "date,sku,product_type,units,customer_price,customer_currency,country,proceeds,proceeds_currency"
            echo "$ROWS"
            echo '```'
            echo ""
            echo "(この issue は metrics workflow が自動起票しました)"
          } > body.md
          gh issue create --title "$TITLE" --body-file body.md
